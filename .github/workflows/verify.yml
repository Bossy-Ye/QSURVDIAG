name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tree:
    runs-on: ubuntu-24.04  # Python 3.9 builds exist for 22.04 and 24.04 only
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tier in the repository tree
        run: python -I scripts/verify.py --out "$RUNNER_TEMP/out"
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack the release archive of this commit into an empty folder
        run: |
          mkdir "$RUNNER_TEMP/archive"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/archive"
      - name: No repository-only file in the archive
        working-directory: ${{ runner.temp }}/archive
        run: |
          for f in .github .gitignore .gitattributes; do
            if [ -e "$f" ]; then echo "repository-only file in the archive: $f"; exit 1; fi
          done
      - name: Record tier in the unpacked archive
        working-directory: ${{ runner.temp }}/archive
        run: python -I scripts/verify.py --out "$RUNNER_TEMP/out"
