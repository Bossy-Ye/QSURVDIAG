name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  record-tier:
    runs-on: ubuntu-24.04  # Python 3.9 builds exist for 22.04 and 24.04 only
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Integrity and RFC 3161 receipts
        run: python -I scripts/verify_integrity.py --tsr
      - name: Record tier
        run: python -I scripts/reproduce.py --out "$RUNNER_TEMP/out"
      - name: Conformance tests
        run: python -I scripts/run_conformance_tests.py --out "$RUNNER_TEMP/out"
      - name: Experiment records
        run: python -I scripts/reproduce_experiments.py --out "$RUNNER_TEMP/out/experiments"
      - name: Integrity after the runs
        run: python -I scripts/verify_integrity.py
