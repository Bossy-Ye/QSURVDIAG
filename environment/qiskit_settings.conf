# Qiskit user configuration in effect on the machine that produced the structural records (docs/protocols.md, section 9).
# scripts/reproduce_analytic.py points QISKIT_SETTINGS here, so a reader's own ~/.qiskit/settings.conf is not read.
# transpile_optimization_level applies to every transpile() call without an explicit level, including QUTest 0.1.0's own.
[default]
transpile_optimization_level = 3
